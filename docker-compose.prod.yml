name: school-admission-prod

x-db-credentials: &db-credentials
  POSTGRES_DB: ${POSTGRES_DB:-admissions}
  POSTGRES_USER: ${POSTGRES_USER:-admissions}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-credentials
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/mahabubemon7/school-admission-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-admissions};Username=${POSTGRES_USER:-admissions};Password=${POSTGRES_PASSWORD};Maximum Pool Size=50
      REDIS_CONNECTION_STRING: redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/mahabubemon7/school-admission-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      API_URL: ${API_URL:?API_URL must be set in .env}
    depends_on:
      - backend

volumes:
  postgres-data:
